<div class="section-header">
  <h2>📜 Historial de Actividad</h2>
  <button class="btn btn-secondary" onclick="loadLogs()">🔄 Actualizar</button>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px">
  <div class="card" style="text-align:center;padding:20px">
    <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Total Registros</div>
    <div id="log-kpi-total" style="font-size:2rem;font-weight:700;color:var(--brown)">—</div>
  </div>
  <div class="card" style="text-align:center;padding:20px">
    <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Hoy</div>
    <div id="log-kpi-hoy" style="font-size:2rem;font-weight:700;color:var(--amber-dark)">—</div>
  </div>
  <div class="card" style="text-align:center;padding:20px">
    <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Usuarios Activos</div>
    <div id="log-kpi-users" style="font-size:2rem;font-weight:700;color:#059669">—</div>
  </div>
  <div class="card" id="log-kpi-top-card" style="text-align:center;padding:20px">
    <div style="font-size:.72rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Módulo más usado</div>
    <div id="log-kpi-top" style="font-size:1.2rem;font-weight:700;color:var(--brown)">—</div>
  </div>
</div>
<div class="card" style="margin-bottom:16px">
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
    <div class="form-group" style="margin:0;flex:1;min-width:180px">
      <label class="form-label">Buscar</label>
      <input id="log-busqueda" class="form-control" placeholder="Empleado, descripción…" oninput="filtrarLogs()"/>
    </div>
    <div class="form-group" style="margin:0">
      <label class="form-label">Módulo</label>
      <select id="log-filtro-modulo" class="form-control" onchange="filtrarLogs()">
        <option value="">Todos</option>
        <option value="auth">Auth</option>
        <option value="ventas">Ventas</option>
        <option value="produccion">Producción</option>
        <option value="inventario">Inventario</option>
        <option value="empleados">Empleados</option>
        <option value="recetas">Recetas</option>
        <option value="proveedores">Proveedores</option>
        <option value="productos">Productos</option>
      </select>
    </div>
  </div>
</div>
<div class="card" style="padding:0">
  <div class="table-wrap">
    <table id="tbl-logs">
      <thead><tr><th>Fecha</th><th>Empleado</th><th>Acción</th><th>Módulo</th><th>Descripción</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="logs-paginacion" style="display:flex;gap:6px;align-items:center;padding:12px 16px;flex-wrap:wrap;border-top:1px solid var(--border)"></div>
</div>
