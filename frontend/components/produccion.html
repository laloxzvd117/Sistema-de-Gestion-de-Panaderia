<div class="section-header"><h2>🧑‍🍳 Producción</h2></div>
<div class="tabs" style="max-width:500px">
  <button class="tab-btn prod-tab active" data-tab="planificar" onclick="switchProduccionTab('planificar')">🔥 Producir Lote</button>
  <button class="tab-btn prod-tab" data-tab="registrar" onclick="switchProduccionTab('registrar')">📋 Registrar Lote</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">
  <div>
    <div id="panel-planificar" class="prod-panel card">
      <div class="card-title">🔥 Producir Lote</div>
      <div class="form-group">
        <label class="form-label">Buscar producto</label>
        <input class="form-control" placeholder="Escribe para filtrar…" oninput="filtrarSelectProduccion('plan-producto', this.value)"/>
      </div>
      <div class="form-group">
        <label class="form-label">Producto a producir</label>
        <select id="plan-producto" class="form-control" onchange="onProductoChange('plan-producto')"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Cantidad planificada</label>
        <input id="plan-estimada" class="form-control" type="number" min="1" placeholder="Ej: 50" oninput="onProductoChange('plan-producto')"/>
      </div>
      <div id="plan-insumos" style="margin:12px 0"></div>
      <button class="btn btn-primary" style="width:100%;color:#fff" onclick="planificarLote()">🔥 Producir Lote</button>
      <div id="plan-resultado"></div>
    </div>
    <div id="panel-registrar" class="prod-panel card" style="display:none">
      <div class="card-title">📋 Registrar Resultado</div>
      <div class="form-group">
        <label class="form-label">Buscar lote</label>
        <input id="reg-busqueda" class="form-control" placeholder="Escribe nombre del producto…" oninput="cargarLotesPendientes(this.value)"/>
      </div>
      <div class="form-group">
        <label class="form-label">Seleccionar Lote</label>
        <select id="reg-codigo" class="form-control"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Cantidad Lograda (Real)</label>
        <input id="reg-lograda" class="form-control" type="number" min="1" placeholder="Ej: 48"/>
      </div>
      <div class="form-group">
        <label class="form-label">Horas Hombre Trabajadas</label>
        <input id="reg-horas" class="form-control" type="number" step="0.5" min="0.5" placeholder="Ej: 2.5"/>
      </div>
      <button class="btn btn-primary" style="width:100%;color:#fff" onclick="registrarResultadoLote()">✅ Registrar Lote</button>
      <div id="reg-resultado"></div>
    </div>
  </div>
  <div class="card" style="padding:0">
    <div style="padding:16px 20px;font-weight:600;border-bottom:1px solid var(--border)">Historial de Producción</div>
    <div class="table-wrap" style="border:none">
      <table id="tbl-produccion">
        <thead><tr><th>Producto</th><th>Fecha</th><th>Cantidad</th><th>Costo Unit.</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="prod-hist-paginacion" style="display:flex;gap:6px;align-items:center;padding:12px 16px;flex-wrap:wrap;border-top:1px solid var(--border)"></div>
  </div>
</div>
