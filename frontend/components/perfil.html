<div class="section-header"><h2>👤 Mi Perfil</h2></div>
<div style="max-width:480px">
  <div class="card">
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)">
      <div id="perfil-avatar" style="width:72px;height:72px;background:var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;font-weight:700;flex-shrink:0">A</div>
      <div>
        <div id="perfil-nombre" style="font-size:1.3rem;font-weight:700;color:var(--brown)">—</div>
        <div id="perfil-rol" style="font-size:.88rem;color:var(--amber-dark);font-weight:600;margin-top:2px">—</div>
      </div>
    </div>
    <div style="display:grid;gap:0">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-muted);font-size:.88rem">Nombre completo</span>
        <span id="perfil-nombre2" style="font-weight:600">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--text-muted);font-size:.88rem">Rol en el sistema</span>
        <span id="perfil-rol2" style="font-weight:600">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0">
        <span style="color:var(--text-muted);font-size:.88rem">Sesión iniciada</span>
        <span id="perfil-sesion" style="font-weight:600;font-size:.85rem">—</span>
      </div>
    </div>
  </div>
</div>
